name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs ask for more only where they need it.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test the code before anything is built.
  # ---------------------------------------------------------------------------
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2. Build the container, prove it runs, scan it, and only then publish it.
  # ---------------------------------------------------------------------------
  build:
    name: Build, scan and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    outputs:
      image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out image name and tag
        id: meta
        run: |
          # Registry paths must be lowercase; the tag is the short commit hash,
          # so every image can be traced back to exactly one commit.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          docker run --detach --name web --publish 8000:8000 "$IMAGE"

          for attempt in $(seq 1 15); do
            if curl --silent --fail http://localhost:8000/healthz; then
              echo
              echo "Container answered after ${attempt} attempt(s)."
              break
            fi
            sleep 1
          done
          curl --silent --fail http://localhost:8000/healthz > /dev/null

          # The container must not run as root.
          test "$(docker exec web id -u)" != "0"

          docker rm --force web

      - name: Scan image for known vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------------------
  # 3. Deploy to Azure Container Apps and check that the new version answers.
  #    Skipped until the Azure connection (OIDC) is configured - see README.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Azure
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # log in to Azure with OIDC, no stored secret
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-cicddemo-dev' }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and app
        id: deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

          url=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters image="$IMAGE" \
            --query properties.outputs.url.value \
            --output tsv)

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live app
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          # Wait until the version that answers is the commit we just built.
          # The app may need a moment: it scales from zero and the new revision
          # only takes over after passing its health checks.
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$URL/api/info" | grep --quiet "$EXPECTED_COMMIT"; then
              echo "Commit $EXPECTED_COMMIT is live after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done

          echo "The new version did not come online in time." >&2
          exit 1
